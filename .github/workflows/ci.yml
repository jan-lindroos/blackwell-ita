name: CI

on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run basedpyright
      - run: uv run marimo check notebooks/*.py
      - run: uv run pytest -m "not slow"
