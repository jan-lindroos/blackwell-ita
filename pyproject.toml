[project]
name = "blackwell-ita"
version = "0.1.0"
description = "Multi-preference inference-time alignment via the Blackwell winner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy",
    "datasets",
    "huggingface-hub",
    "marimo>=0.23.16",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "torch",
    # 5.15 predates torch 2.13 and its Qwen3 modeling file fails to import
    # against it; 5.16.1 is the first version verified compatible
    "transformers>=5.16.1",
    "wandb",
]

# PSC Bridges-2 H100 nodes run driver 560 (CUDA <= 12.6); the default PyPI
# torch is a CUDA-13 build that cannot initialize there. Pull torch from the
# cu126 wheel index on Linux instead; macOS keeps the PyPI build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell's trailing bare expression is its rendered output, and the
# serialised cell format can end with a bare return
"notebooks/*" = ["B018", "PLR1711"]

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]

[[tool.basedpyright.executionEnvironments]]
# A marimo cell's trailing bare expression is its rendered output
root = "notebooks"
reportUnusedExpression = "none"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["notebooks"]

[[tool.basedpyright.executionEnvironments]]
root = "scripts"
extraPaths = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["notebooks"]
markers = ["slow: downloads models"]
